<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente IA & Generador - Meditipps</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Estilos oficiales de n8n chat -->
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Contenedor General en Grid (2 Columnas: Chat + Panel de Imágenes) -->
  <div class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-3 gap-6 h-[85vh]">
    
    <!-- COLUMNA 1 & 2: Chat Nativo de n8n (Ocupa 2 espacios) -->
    <div class="lg:col-span-2 bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl flex flex-col overflow-hidden relative">
      <!-- Cabecera del Chat -->
      <div class="bg-slate-900 px-6 py-4 border-b border-slate-700 flex items-center justify-between z-10 flex-shrink-0">
        <div class="flex items-center space-x-3">
          <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
          <h1 class="font-bold text-lg text-slate-100">Asistente IA - Meditipps</h1>
        </div>
        <span class="text-xs text-slate-400 bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700">RAG Activo</span>
      </div>
      <!-- Contenedor del Chat Embebido -->
      <div id="n8n-chat-container" class="flex-1 w-full h-full relative overflow-hidden bg-slate-800"></div>
    </div>

    <!-- COLUMNA 3: Panel Lateral Independiente para Gráficos/Imágenes -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
      <!-- Cabecera del Panel -->
      <div class="bg-slate-900 px-6 py-4 border-b border-slate-700 flex items-center justify-between">
        <h2 class="font-bold text-sm text-slate-100 flex items-center gap-2">
          <span>🎨</span> Generador Visual
        </h2>
        <span class="text-xs text-sky-400 bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700">Multimedia</span>
      </div>

      <!-- Cuerpo del Panel de Imágenes -->
      <div class="p-5 flex-1 flex flex-col justify-between overflow-y-auto space-y-4">
        
        <!-- Descripción y Formulario -->
        <div class="space-y-3">
          <p class="text-xs text-slate-400 leading-relaxed">
            Solicita esquemas, diagramas anatómicos o ilustraciones basadas en los documentos del sistema.
          </p>
          
          <form id="image-form" class="space-y-3">
            <div>
              <label for="image-prompt" class="block text-xs font-medium text-slate-300 mb-1">Descripción del Gráfico:</label>
              <textarea 
                id="image-prompt" 
                rows="3" 
                placeholder="Ej. Diagrama detallado del sistema límbico..."
                class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-100 placeholder-slate-500 text-xs focus:outline-none focus:border-sky-500 transition-colors resize-none"
                required
              ></textarea>
            </div>
            
            <button 
              type="submit" 
              id="image-submit-btn"
              class="w-full bg-sky-600 hover:bg-sky-500 text-white py-2.5 px-4 rounded-xl font-medium text-xs transition-colors shadow-md flex items-center justify-center gap-2 disabled:opacity-50"
            >
              Generar Ilustración
            </button>
          </form>
        </div>

        <!-- Área de Visualización del Resultado -->
        <div class="flex-1 bg-slate-900/60 border border-slate-700/60 rounded-xl p-3 flex flex-col items-center justify-center relative min-h-[220px]">
          <!-- Indicador de Carga (Oculto por defecto) -->
          <div id="image-loader" class="hidden flex flex-col items-center space-y-2">
            <div class="w-6 h-6 border-2 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
            <span class="text-xs text-slate-400 italic">Renderizando imagen...</span>
          </div>

          <!-- Estado Inicial / Placeholder -->
          <div id="image-placeholder" class="text-center text-slate-500 text-xs px-4">
            El gráfico generado aparecerá aquí de forma automática.
          </div>

          <!-- Imagen Final Resultante (Oculta hasta recibir respuesta) -->
          <div id="image-result-container" class="hidden w-full h-full flex flex-col items-center justify-center">
            <img id="generated-image" src="" alt="Gráfico Médico" class="max-h-[200px] rounded-lg object-contain shadow-md mb-2">
            <!-- Botón interactivo para descarga directa en alta resolución -->
            <button id="open-high-res" class="text-[10px] text-sky-400 hover:underline bg-transparent border-none cursor-pointer p-0">Abrir / Descargar en alta resolución</button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Script Principal: Chat de n8n + Lógica del Generador de Imágenes -->
  <script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    // 1. Inicializar Chat Nativo de n8n en Pantalla Completa
    createChat({
      webhookUrl: 'https://n8n.yanapay-labs.com/webhook/chat-meditipps',
      target: '#n8n-chat-container',
      mode: 'fullscreen',
      showWelcomeScreen: false,
      initialMessages: [
        '¡Hola! Soy el Asistente Inteligente Oficial de Meditipps. ¿En qué consulta médica o académica te puedo ayudar hoy?'
      ],
      i18n: {
        es: {
          title: 'Asistente Meditipps',
          subtitle: 'RAG Institucional Activo',
          placeholder: 'Escribe tu pregunta aquí...',
        }
      }
    });

    // 2. Lógica del Panel Lateral de Imágenes (Independiente)
    const imageForm = document.getElementById('image-form');
    const imagePromptInput = document.getElementById('image-prompt');
    const imageSubmitBtn = document.getElementById('image-submit-btn');
    const imageLoader = document.getElementById('image-loader');
    const imagePlaceholder = document.getElementById('image-placeholder');
    const imageResultContainer = document.getElementById('image-result-container');
    const generatedImage = document.getElementById('generated-image');
    const openHighResBtn = document.getElementById('open-high-res');

    let currentBase64Url = '';
    let currentObjectUrl = '';

    imageForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const promptText = imagePromptInput.value.trim();
      if (!promptText) return;

      // Bloquear UI del panel y mostrar loader
      imagePromptInput.disabled = true;
      imageSubmitBtn.disabled = true;
      imagePlaceholder.classList.add('hidden');
      imageResultContainer.classList.add('hidden');
      imageLoader.classList.remove('hidden');

      try {
        // Petición al Webhook secundario exclusivo de imágenes en n8n
        const response = await fetch('https://n8n.yanapay-labs.com/webhook/generar-imagen', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });

        if (!response.ok) throw new Error('Error al conectar con el servicio de generación.');

        const data = await response.json();
        const imageUrl = data.imageUrl || data.output || data.url;

        if (imageUrl) {
          currentBase64Url = imageUrl;

          // Convertir Base64 a Blob URL para renderizar limpio en el contenedor
          const arr = imageUrl.split(',');
          const mime = arr[0].match(/:(.*?);/)[1];
          const bstr = atob(arr[1]);
          let n = bstr.length;
          const u8arr = new Uint8Array(n);
          while (n--) {
            u8arr[n] = bstr.charCodeAt(n);
          }
          const blob = new Blob([u8arr], { type: mime });

          if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
          currentObjectUrl = URL.createObjectURL(blob);

          generatedImage.src = currentObjectUrl;
          imageResultContainer.classList.remove('hidden');
        } else {
          throw new Error('No se recibió una URL válida.');
        }

      } catch (error) {
        console.error(error);
        alert('⚠️ Ocurrió un error al generar la imagen. Verifica el webhook secundario en n8n.');
        imagePlaceholder.classList.remove('hidden');
      } finally {
        imagePromptInput.disabled = false;
        imageSubmitBtn.disabled = false;
        imageLoader.classList.add('hidden');
      }
    });

    // Manejo robusto: Descarga directa del archivo de imagen optimizada
    openHighResBtn.addEventListener('click', () => {
      if (!currentBase64Url) return;

      try {
        const link = document.createElement('a');
        link.href = currentBase64Url;
        link.download = `meditipps-grafico-${Date.now()}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        console.error('Error al descargar la imagen:', err);
        alert('⚠️ No se pudo descargar la imagen.');
      }
    });
  </script>
</body>
</html>
