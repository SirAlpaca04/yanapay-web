<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente IA - Yanapay Labs</title>
  <!-- Tailwind CSS para un diseño limpio y moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería Marked.js para renderizar Markdown de forma impecable -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Contenedor Principal del Chat -->
  <div class="w-full max-w-3xl bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl flex flex-col h-[80vh] overflow-hidden">
    
    <!-- Cabecera -->
    <div class="bg-slate-900 px-6 py-4 border-b border-slate-700 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
        <h1 class="font-bold text-lg text-slate-100">Asistente IA - Meditipps</h1>
      </div>
      <span class="text-xs text-slate-400 bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700">RAG Activo</span>
    </div>

    <!-- Área de Mensajes -->
    <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4">
      <!-- Mensaje Inicial del Bot -->
      <div class="flex items-start space-x-3">
        <div class="bg-sky-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm flex-shrink-0">IA</div>
        <div class="bg-slate-700 text-slate-100 rounded-2xl px-4 py-3 max-w-[80%] text-sm shadow-sm leading-relaxed">
          ¡Hola! Soy el Asistente Inteligente Oficial de Meditipps. ¿En qué consulta médica o académica te puedo ayudar hoy?
        </div>
      </div>
    </div>

    <!-- Indicador de "Escribiendo..." (Oculto por defecto) -->
    <div id="typing-indicator" class="hidden px-6 py-2 text-xs text-slate-400 italic bg-slate-800/50 flex items-center space-x-2">
      <span class="inline-block w-2 h-2 bg-sky-500 rounded-full animate-bounce"></span>
      <span class="inline-block w-2 h-2 bg-sky-500 rounded-full animate-bounce [animation-delay:0.2s]"></span>
      <span class="inline-block w-2 h-2 bg-sky-500 rounded-full animate-bounce [animation-delay:0.4s]"></span>
      <span>El asistente está procesando tu consulta...</span>
    </div>

    <!-- Barra de Entrada de Texto -->
    <div class="p-4 bg-slate-900 border-t border-slate-700">
      <form id="chat-form" class="flex items-center space-x-2">
        <input 
          type="text" 
          id="chat-input" 
          placeholder="Escribe tu pregunta o instrucción aquí..." 
          autocomplete="off"
          class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-sky-500 text-sm transition-colors"
          required
        >
        <button 
          type="submit" 
          id="send-button"
          class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-3 rounded-xl font-medium text-sm transition-colors flex items-center justify-center shadow-md disabled:opacity-50"
        >
          Enviar
        </button>
      </form>
    </div>

  </div>

  <!-- Lógica de Conexión JavaScript -->
  <script>
    const WEBHOOK_URL = 'https://TU-SERVIDOR-N8N/webhook/chat-meditipps'; // 👈 REEMPLAZA CON TU WEBHOOK ACTIVO

    // Gestión de Sesión Única por Navegador
    let sessionId = localStorage.getItem('yanapay_session_id');
    if (!sessionId) {
      sessionId = 'sess_' + Math.random().toString(36).substring(2, 11);
      localStorage.setItem('yanapay_session_id', sessionId);
    }

    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    const messagesContainer = document.getElementById('chat-messages');
    const typingIndicator = document.getElementById('typing-indicator');
    const sendButton = document.getElementById('send-button');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userText = input.value.trim();
      if (!userText) return;

      // 1. Mostrar mensaje del usuario en pantalla
      appendMessage(userText, 'user');
      input.value = '';
      input.disabled = true;
      sendButton.disabled = true;
      typingIndicator.classList.remove('hidden');
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      try {
        // 2. Petición POST directa al Webhook de n8n
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chatInput: userText,
            sessionId: sessionId
          })
        });

        if (!response.ok) throw new Error('Error en la comunicación con el servidor.');

        const data = await response.json();
        
        // Extraer respuesta limpia de n8n (soporta tanto {output: "..."} como texto plano directo)
        const botReply = data.output || data.response || JSON.stringify(data);

        // 3. Mostrar respuesta del Bot con Markdown renderizado
        appendMessage(botReply, 'bot');

      } catch (error) {
        console.error(error);
        appendMessage('⚠️ Ocurrió un error de conexión con el servidor de n8n. Por favor, intenta de nuevo.', 'bot');
      } finally {
        input.disabled = false;
        sendButton.disabled = false;
        typingIndicator.classList.add('hidden');
        input.focus();
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    });

    function appendMessage(text, sender) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `flex items-start space-x-3 ${sender === 'user' ? 'justify-end' : ''}`;

      if (sender === 'bot') {
        messageDiv.innerHTML = `
          <div class="bg-sky-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm flex-shrink-0">IA</div>
          <div class="bg-slate-700 text-slate-100 rounded-2xl px-4 py-3 max-w-[85%] text-sm shadow-sm leading-relaxed prose prose-invert">
            ${marked.parse(text)}
          </div>
        `;
      } else {
        messageDiv.innerHTML = `
          <div class="bg-slate-600 text-slate-100 rounded-2xl px-4 py-3 max-w-[85%] text-sm shadow-sm leading-relaxed">
            ${escapeHtml(text)}
          </div>
          <div class="bg-slate-700 text-slate-300 rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm flex-shrink-0">Tú</div>
        `;
      }

      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
